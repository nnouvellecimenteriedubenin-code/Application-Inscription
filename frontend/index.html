<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application d'Inscription</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="entete-principal">
        <h1>Application d'Inscription</h1>
        <a id="lienFormulaire" href="/" aria-current="page">Formulaire d'inscription</a>
        <p id="messageSession" class="message-session">Veuillez vous connecter pour utiliser l'application.</p>
    </header>

    <nav id="navigationApp" class="navigation-app" aria-label="Navigation principale">
        <div class="navigation-liens">
            <a id="lienInscriptions" href="#listeInscriptions" style="display:none">Liste des inscriptions</a>
            <a id="lienAdmin" href="/admin-utilisateurs" style="display:none">Gestion des utilisateurs</a>
        </div>
        <div class="navigation-compte">
            <button id="boutonDeconnexion" class="bouton-deconnexion" type="button" hidden>Déconnexion</button>
        </div>
    </nav>

    <form id="formulaire" style="display:none">

        <!-- Sert à mémoriser l'inscription en modification -->
        <input type="hidden" id="idInscription">


        <label>Nom :</label><br>
        <input type="text" id="nom" required><br><br>


        <label>Prénom :</label><br>
        <input type="text" id="prenom" required><br><br>


        <label>Date de naissance :</label><br>
        <input type="date" id="dateNaissance" required><br><br>


        <label>Sexe :</label><br>

        <select id="sexe">
            <option>Homme</option>
            <option>Femme</option>
        </select>

        <br><br>


        <label>Adresse :</label><br>
        <input type="text" id="adresse"><br><br>


        <label>Téléphone :</label><br>
        <input type="tel" id="telephone"><br><br>


        <label>Courriel :</label><br>
        <input type="email" id="courriel"><br><br>


        <button type="submit" id="boutonEnregistrer">
            Enregistrer
        </button>


    </form>


    <hr>

    <section id="listeInscriptions" class="section-inscriptions" style="display:none">
        <h2>Liste des inscriptions</h2>

        <div class="zone-recherche">
            <label for="recherche">Rechercher</label>
            <input type="text" id="recherche" placeholder="Nom, prénom ou téléphone">
            <button id="boutonExporterExcel" type="button" style="display:none">Exporter vers Excel</button>
        </div>

        <div class="table-entete">
            <span id="compteurInscriptions">0 inscription affichée</span>
        </div>

        <table id="tableInscriptions">

            <thead>

                <tr>
                    <th>ID</th>
                    <th class="sortable" data-col="nom">Nom <span class="tri-indicateur"></span></th>
                    <th class="sortable" data-col="prenom">Prénom <span class="tri-indicateur"></span></th>
                    <th class="sortable" data-col="sexe">Sexe <span class="tri-indicateur"></span></th>
                    <th class="sortable" data-col="telephone">Téléphone <span class="tri-indicateur"></span></th>
                    <th class="sortable" data-col="date">Date <span class="tri-indicateur"></span></th>
                    <th>Courriel</th>
                    <th>Actions</th>
                </tr>

            </thead>


            <tbody>

            </tbody>


        </table>
    </section>


    <script src="script.js"></script>


</body>

</html>
