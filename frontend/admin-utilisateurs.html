<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des utilisateurs</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Gestion des utilisateurs</h1>

    <nav class="navigation-app" aria-label="Navigation principale">
        <div class="navigation-liens">
            <a href="/">Formulaire d'inscription</a>
            <a href="/#listeInscriptions">Liste des inscriptions</a>
            <a href="/admin-utilisateurs" aria-current="page">Gestion des utilisateurs</a>
        </div>
        <div class="navigation-compte">
            <button id="boutonDeconnexion" class="bouton-deconnexion" type="button">Déconnexion</button>
        </div>
    </nav>

    <div class="filtres-admin">
        <label for="filtreStatut">Filtrer par statut</label>
        <select id="filtreStatut">
            <option value="tous">Tous</option>
            <option value="en_attente">En attente</option>
            <option value="actif">Actifs</option>
        </select>
    </div>

    <p id="messageAdmin" class="message-admin">Chargement des utilisateurs...</p>

    <table class="tableau-admin">
        <thead>
            <tr>
                <th>Nom</th>
                <th>Prénom</th>
                <th>Identifiant</th>
                <th>Email</th>
                <th>Téléphone</th>
                <th>Rôle</th>
                <th>Statut</th>
                <th>Date de création</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="corpsUtilisateurs"></tbody>
    </table>

    <script src="admin-utilisateurs.js"></script>
</body>
</html>
