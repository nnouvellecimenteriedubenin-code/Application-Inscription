<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer un compte</title>
    <style>
        :root {
            --bleu: #1f4e79;
            --bleu-fonce: #163b5c;
            --fond: #f4f6f9;
            --blanc: #ffffff;
            --gris: #6b7280;
            --bord: #dce4ee;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef4f9 0%, var(--fond) 100%);
            color: #1f2937;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .carte {
            width: 100%;
            max-width: 480px;
            background: var(--blanc);
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
            padding: 32px;
        }

        .titre {
            margin: 0 0 8px;
            color: var(--bleu);
            font-size: 28px;
            text-align: center;
        }

        .soustitre {
            margin: 0 0 24px;
            text-align: center;
            color: var(--gris);
            font-size: 14px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        label {
            font-weight: bold;
            color: var(--bleu-fonce);
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--bord);
            border-radius: 10px;
            font-size: 15px;
        }

        .champ-mot-de-passe {
            position: relative;
        }

        .champ-mot-de-passe input {
            padding-right: 48px;
        }

        .toggle-mot-de-passe {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 18px;
            color: var(--bleu);
        }

        input:focus {
            outline: none;
            border-color: var(--bleu);
            box-shadow: 0 0 0 3px rgba(31, 78, 121, 0.15);
        }

        button {
            margin-top: 8px;
            padding: 12px 16px;
            border: none;
            border-radius: 10px;
            background: var(--bleu);
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button:hover {
            background: var(--bleu-fonce);
        }

        .message {
            margin-top: 14px;
            min-height: 24px;
            text-align: center;
            font-size: 14px;
            color: var(--bleu-fonce);
        }

        .lien {
            display: block;
            margin-top: 14px;
            text-align: center;
            color: var(--bleu);
            text-decoration: none;
            font-weight: bold;
        }

        .lien:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="carte">
        <h1 class="titre">Créer un compte</h1>
        <p class="soustitre">Votre demande sera soumise à validation.</p>

        <form id="formulaireInscription">
            <label for="nom">Nom</label>
            <input type="text" id="nom" name="nom" required>

            <label for="prenom">Prénom</label>
            <input type="text" id="prenom" name="prenom" required>

            <label for="identifiant">Identifiant</label>
            <input type="text" id="identifiant" name="identifiant" required>

            <label for="email">Courriel</label>
            <input type="email" id="email" name="email" required>

            <label for="telephone">Téléphone</label>
            <input type="text" id="telephone" name="telephone" required>

            <label for="motDePasse">Mot de passe</label>
            <div class="champ-mot-de-passe">
                <input type="password" id="motDePasse" name="motDePasse" required>
                <button type="button" class="toggle-mot-de-passe" data-cible="motDePasse" aria-label="Afficher le mot de passe">👁</button>
            </div>

            <label for="confirmationMotDePasse">Confirmer le mot de passe</label>
            <div class="champ-mot-de-passe">
                <input type="password" id="confirmationMotDePasse" name="confirmationMotDePasse" required>
                <button type="button" class="toggle-mot-de-passe" data-cible="confirmationMotDePasse" aria-label="Afficher le mot de passe">👁</button>
            </div>

            <button type="submit">Créer mon compte</button>
        </form>

        <p id="messageInscription" class="message"></p>
        <a class="lien" href="/login">Retour à la connexion</a>
    </div>

    <script src="register.js"></script>
</body>
</html>
